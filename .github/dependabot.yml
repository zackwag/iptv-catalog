version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
    prefix-development: build
    include: scope
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  groups:
    react:
      patterns:
      - react
      - react-dom
      - '@types/react'
      - '@types/react-dom'
  commit-message:
    prefix: chore
    prefix-development: build
    include: scope
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ci
    include: scope
